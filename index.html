<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مكتبي">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>مكتبي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style id="main-style">
:root{
  --paper:#F5F4F0; --card:#FFFFFF; --ink:#1C1B33; --ink2:#3B3A5C;
  --stamp:#453C8C; --ledger:#0E6B52; --string:#A8341F; --kraft:#B08432;
  --line:#E4E2DA; --muted:#6E6C7E; --soft:#EFEDE6; --alert:#FDF0EC; --night:#2B2A55; --ta:#5A6B8C;
  --kufi-head:'Reem Kufi','Noto Kufi Arabic','Sakkal Majalla','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;font-size:14px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
table{border-collapse:collapse}
h2{font-family:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;font-weight:700;font-size:15px}
.kufi{font-family:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.wrap.wide{max-width:1840px}

/* header */
header{background:var(--ink);color:#fff}
header .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:16px}
header .sub{font-size:11px;opacity:.6;letter-spacing:1px}
header h1{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:20px;margin-top:3px}
header .sync{font-size:11px;opacity:.78;margin-top:5px;display:flex;align-items:center;gap:6px}
header .sync i{width:7px;height:7px;border-radius:50%;display:inline-block}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{padding:9px 16px;border-radius:10px 10px 0 0;white-space:nowrap;color:rgba(255,255,255,.62)}
nav button.on{background:var(--paper);color:var(--ink);font-weight:600}

/* blocks */
main{padding:20px 0 10px}
main.anim{animation:f .25s ease both}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main.anim{animation:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.p4{padding:16px}.p3{padding:12px}
.stack>*+*{margin-top:18px}
.grid{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.scroll{overflow-x:auto}
.mr{margin-right:auto}.ml{margin-left:auto}
.muted{color:var(--muted)}.xs{font-size:12px}.xxs{font-size:11px}
.b{font-weight:600}.b7{font-weight:700}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mb2{margin-bottom:8px}

/* controls */
.inp{background:#FBFBF9;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
.inp:focus{border-color:var(--stamp)}
.sm{padding:6px 8px;font-size:13px;width:auto}
label.f,div.f{display:block}
label.f>span,div.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.btn{padding:8px 16px;border-radius:10px;font-weight:600;color:#fff;background:var(--stamp);font-size:14px}
.btn.s{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.ink{background:var(--ink)}.btn.led{background:var(--ledger)}.btn.kra{background:var(--kraft)}
.btn.str{background:var(--string)}
.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.mini{font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--ink2);font-weight:600;background:#fff}
.mini.g{background:var(--ledger);color:#fff;border-color:var(--ledger)}
.mini.k{color:var(--kraft);border-color:var(--kraft)}
.mini.r{color:var(--string)}
.mini.p{color:var(--stamp)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.seg{display:inline-flex;background:#EAE8E1;border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-size:13px;color:var(--ink2)}
.seg button.on{background:#fff;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
/* كبسولة اختيارين (زي زرار on/off) */
.cap{display:inline-flex;background:var(--ink);border-radius:99px;padding:4px;gap:4px;flex-wrap:wrap;max-width:100%}
.cap button{padding:9px 20px;border-radius:99px;color:rgba(255,255,255,.72);font-weight:600;font-size:13.5px;white-space:nowrap}
.cap button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cap button small{font-weight:400;opacity:.7;font-size:11px;margin-right:4px}
.cell-inp{width:100%;min-width:140px;border:1px dashed var(--line);background:#FBFBF9;border-radius:7px;padding:5px 7px;font-size:12px;outline:none}
.cell-inp:focus{border-style:solid;border-color:var(--stamp);background:#fff}

/* قايمة الاختيار: بتقفل لوحدها بعد كل اختيار، وعلامة ✓ صغيرة على الشمال */
.dd{position:relative}
.ddb{text-align:right;display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;overflow:hidden}
.ddb span{overflow:hidden;text-overflow:ellipsis}
.ddb::after{content:"▾";color:var(--muted);font-size:11px;flex-shrink:0}
.ddb.has{border-color:var(--stamp);background:#F4F2FB;color:var(--stamp);font-weight:600}
.ddp{position:absolute;top:100%;right:0;min-width:100%;width:max-content;max-width:min(360px,86vw);z-index:45;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 32px rgba(28,27,51,.16);margin-top:4px;max-height:320px;overflow-y:auto;padding:5px}
.ddi{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:7px 10px;border-radius:8px;font-size:13px;text-align:right;color:var(--ink)}
.ddi:hover{background:var(--soft)}
.dds{position:sticky;top:-5px;background:#fff;padding:4px 2px 6px;margin-top:-1px;z-index:1}
.dds .inp{height:34px;font-size:13px}
.ddi.hid{display:none}
.tpw .tpq{max-width:320px;margin-bottom:8px}.pick.hid{display:none}
.ddnone{padding:10px;font-size:12px;color:var(--muted);display:none}
.ddi.sel{color:var(--stamp);font-weight:600;background:#F6F4FC}
.ddi.none{color:var(--muted);border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;margin-bottom:3px}
.ddi i{font-style:normal;font-size:12px;color:var(--stamp);width:12px;flex-shrink:0;text-align:left}
.ddi small{color:var(--muted);font-size:11px;font-weight:400}

/* chips */
.chip{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;display:inline-block;white-space:nowrap}
.pill{font-size:12px;padding:6px 13px;border-radius:99px;font-weight:600;display:inline-block}
.pick{font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:#FBFBF9;color:var(--ink2)}
.pick.on{color:#fff;font-weight:600}
.flag{background:#FAF0DB;border:1px solid #E6CCA2;border-radius:8px;padding:7px 10px;color:#885A25;font-size:12px;line-height:1.7}
.info{background:#F2F5FB;border-right:4px solid #596C9D;padding:10px 14px;border-radius:10px;line-height:1.85;font-size:12px}

/* stat */
.stat{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat i{position:absolute;top:0;bottom:0;right:0;width:4px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:'Noto Kufi Arabic',sans-serif;font-size:25px;font-weight:700;line-height:1.25}
.stat .s{font-size:11px;color:var(--muted);margin-top:3px}

/* tables */
table.t{width:100%;font-size:13px}
table.t th{background:var(--soft);border:1px solid var(--line);padding:6px 8px;text-align:right;font-size:12px;font-weight:600}
table.t td{border:1px solid var(--line);padding:6px 8px;vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#FAF9F6}
table.t tr.warn td{background:var(--alert)}
table.t tr.tot td{background:var(--soft);font-weight:700}
table.l{width:100%;font-size:13px}
table.l th{text-align:right;padding:8px;border-bottom:1px solid var(--line);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;cursor:pointer}
table.l th.on{color:var(--stamp)}
table.l td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.l tr.warn td{background:var(--alert)}
.dash{border-bottom:1px dashed var(--line);padding:8px 0}

/* bars */
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
.hbar{display:flex;align-items:center;gap:10px;padding:5px 0}
.hbar .nm{width:130px;font-size:12px;text-align:left;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;background:#F3F2ED;border-radius:5px;height:15px;overflow:hidden;display:flex}
.hbar .tr i{height:100%}
.hbar .vl{width:52px;font-size:11px;font-weight:700;flex-shrink:0}
.att-bar{display:flex;height:26px;border-radius:9px;overflow:hidden;margin-top:12px}
.att-bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.lg{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* تنبيه تأخر التصرف */
.rem{border-radius:14px;border:1px solid #EFC9BE;background:var(--alert);overflow:hidden}
.rem-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.rem-bar .ic{width:26px;height:26px;border-radius:50%;background:var(--string);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.rem-bar .tx{flex:1;min-width:200px;font-size:13px;line-height:1.6}
.rem-list{border-top:1px solid #EFC9BE;padding:6px 14px 12px;max-height:260px;overflow-y:auto;background:#FFF8F5}
.rem-list .it{font-size:12.5px;line-height:1.9;border-bottom:1px dashed #EFD8D0;padding:3px 0}

/* modal */
.ov{position:fixed;inset:0;background:rgba(28,27,51,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow-y:auto}
.mod{background:var(--card);border-radius:16px;width:100%;margin:24px 0}
.mod .hd{background:var(--ink);color:#fff;padding:12px 16px;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mod .hd .t{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700}
.mod .bd{padding:16px}
.w-sm{max-width:460px}.w-md{max-width:760px}.w-lg{max-width:880px}.w-xl{max-width:1060px}
.lock{max-width:400px;margin:40px auto;text-align:center}
.lock .ic{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:99px;font-size:13px;z-index:200;display:none;max-width:92vw;text-align:center}
footer.sig{text-align:center;padding:34px 16px 24px}
.gate{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:40px 16px 0;background:linear-gradient(180deg,var(--ink) 0,var(--ink) 38%,transparent 38%)}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px 26px;width:100%;max-width:380px;text-align:center;box-shadow:0 18px 50px rgba(28,27,51,.18)}
.gate-logo{width:86px;height:86px;object-fit:contain;border-radius:50%;margin:-74px auto 10px;display:block;background:#fff;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.gate-k{font-size:12px;color:var(--muted);letter-spacing:.5px}
.gate-card h1{font-size:22px;margin:4px 0 2px}
.gate-s{font-size:13px;color:var(--ink2);margin-bottom:16px}
.gate-m{background:#FCEDEC;color:#9B2C2C;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:0 0 10px}
#gate-pass{text-align:center;letter-spacing:3px}
.dsp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.dsp-grid .pick{padding:12px 10px;font-size:14px;text-align:center;justify-content:center}
.rcnt{display:inline-block;min-width:22px;margin-right:6px;padding:1px 7px;border-radius:9px;background:var(--soft);color:var(--ink);font-weight:700;font-size:12px}
.btn.xw{background:#2B579A;color:#fff}.btn.xx{background:#217346;color:#fff}
.gate-link{display:block;width:100%;margin-top:14px;font-size:12.5px;color:var(--stamp);text-decoration:underline;background:none}
.whoami{color:#fff;font-size:12.5px;font-weight:600;line-height:1.25;text-align:left;padding-left:4px}.whoami small{display:block;font-weight:400;opacity:.65;font-size:11px}
.ro-note{background:#EEF1F8;color:#2F4C8A;border-radius:10px;padding:8px 12px;font-size:12.5px}
.hist{border-top:1px dashed var(--line);padding-top:12px}.hist .t td,.hist .t th{font-size:12px}
fieldset.ro-fs{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:16px}
fieldset.ro-fs .pick:not(.on){display:none}fieldset.ro-fs .tpq{display:none}
#printroot table.pt td{white-space:pre-line}
.statbtn{display:block;width:100%;text-align:inherit;padding:0;background:none;border:0;cursor:pointer}.statbtn .stat{height:100%}.statbtn:hover .stat{box-shadow:0 0 0 2px #EFC9BE}
.memrow{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px}.memrow.vac{background:#FBF5EA;border-color:#EBD9B5}
.chk{width:16px;height:16px;accent-color:var(--stamp);flex-shrink:0}
.vacbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#F6F4FC;border:1px solid #DCD6F2}
.memed{border:1px solid #DCD6F2;background:#FBFAFF;border-radius:12px;padding:14px}
.lockb{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
footer.sig hr{width:54px;border:none;border-top:1px solid var(--line);margin:0 auto 16px}
footer.sig .n{font-family:'Aref Ruqaa','Times New Roman',serif;font-size:19px;line-height:2}
footer.sig .d{font-size:12px;color:var(--muted);margin-top:2px}

/* ── رأس وتذييل الأوراق الرسمية ── */
.lh{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:10px}
.lh-r{text-align:center;font-family:var(--kufi-head);color:#1C1B33;line-height:1.6;padding-right:12px;border-right:3px solid #1C1B33}
.lh-r .l1{font-size:21px;font-weight:700;border-bottom:1.6px solid #1C1B33;padding-bottom:1px;margin-bottom:4px;letter-spacing:.5px}
.lh-r .l2,.lh-r .l3{font-size:17px;font-weight:700}
.lh-l img{width:96px;height:96px;object-fit:contain;display:block}
.lh-rule{border-top:2px solid #1C1B33;border-bottom:.8px solid #1C1B33;height:4px;margin-bottom:10px}
.doc-title{text-align:center;font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:16px;margin:6px 0 3px;color:#1C1B33}
.doc-sub{text-align:center;font-size:11px;color:#555;margin-bottom:10px}
.lf{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:26px;padding-top:6px}
.lf-r .k{font-size:12px;color:#555;font-weight:600}
.lf-r .v{font-size:13px;font-weight:700;margin-top:4px;color:#1C1B33}
.lf-l{text-align:center;min-width:210px}
.lf-l .k{font-family:var(--kufi-head);font-size:17px;font-weight:700;color:#1C1B33}
.lf-l .v{font-family:var(--kufi-head);font-size:18px;font-weight:700;margin-top:6px;color:#1C1B33;min-height:30px}
.foot-notes{text-align:right;margin-top:12px;line-height:1.5}
.credit{font-size:8.5px;color:#9a9a9a;font-family:'Aref Ruqaa','Traditional Arabic',serif}
.edited-note{font-size:8px;color:#9a9a9a;display:none}
.edited-note.on{display:block}

/* الكشف (في تابة لوحده أو جوه اللوحة) */
#printroot{display:none}
#printroot.show{display:block;position:fixed;inset:0;background:#fff;z-index:100;overflow:auto;padding:18px}
body.sheetmode{background:#E9E7E0}
body.sheetmode #printroot.show{position:static;background:transparent;padding:0 0 30px}
body.sheetmode .paper{background:#fff;max-width:1120px;margin:18px auto 0;padding:26px 30px;border-radius:6px;box-shadow:0 6px 28px rgba(28,27,51,.14)}
#printroot table.pl{width:100%}
#printroot table.pl>thead>tr>td,#printroot table.pl>tfoot>tr>td,#printroot table.pl>tbody>tr>td{border:none;padding:0}
#printroot table.pt{width:100%;font-size:11px}
#printroot table.pt.tiny{font-size:9.5px}
#printroot table.pt th{background:#EFEDE6;border:1px solid #999;padding:5px 7px;text-align:right}
#printroot table.pt.tiny th,#printroot table.pt.tiny td{padding:3px 4px}
#printroot table.pt.tiny tbody td:nth-child(2),#printroot table.pt.tiny tbody td:nth-child(3){white-space:nowrap}
#printroot table.pt td{border:1px solid #999;padding:4px 7px}
#printroot table.pt tr{page-break-inside:avoid}
#printroot table.pt tr.tot td{font-weight:700;background:#F4F2EC}
#printroot.editing [contenteditable="true"]{outline:1px dashed #B08432;outline-offset:-2px;background:#FFFCF2}
.pe-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  padding:10px 16px;background:var(--ink);color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.18)}
.pe-bar .t{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:14px}
.pe-bar .btn.gh{color:#fff;border-color:rgba(255,255,255,.3)}
.pe-bar .inp{background:#fff;color:var(--ink)}
@media print{
  html,body{background:#fff!important}
  body>*{display:none!important}
  #printroot.show{display:block!important;position:static;padding:0}
  #printroot .noprint{display:none!important}
  body.sheetmode .paper{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}
  #printroot.editing [contenteditable="true"]{outline:none!important;background:transparent!important}
  @page{size:A4 landscape;margin:10mm}
  #printroot table.pl>thead{display:table-header-group}
  #printroot table.pl>tfoot{display:table-footer-group}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:640px){
  .hbar .nm{width:92px}
  header h1{font-size:17px}
  .lh-r .l1{font-size:17px}.lh-r .l2,.lh-r .l3{font-size:14px}
  .lh-l img{width:70px;height:70px}
  .cap button{padding:8px 13px;font-size:12.5px}
}

/* ── مكتبي: إضافات النسخة الشخصية ── */
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.r{background:var(--string)}.dot.a{background:var(--kraft)}.dot.b{background:#1F6F8B}
.bell{position:relative;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:5px 10px;font-size:14px}
.bell span{font-size:11px;font-weight:700;margin-right:4px}
.bell.red{background:var(--string);border-color:var(--string)}
.navc{background:var(--string);color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px;margin-right:3px}
.offq{position:relative}

.cal-s{color:#fff;font-size:10.5px;border-radius:6px;padding:1px 6px;font-weight:600;align-self:flex-start}
.mtabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--ink);overflow-x:auto}
.mtabs button{padding:8px 14px;border-radius:9px 9px 0 0;color:rgba(255,255,255,.65);white-space:nowrap;font-size:13px}
.mtabs button.on{background:var(--card);color:var(--ink);font-weight:600}

.iegrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media(max-width:900px){.iegrid{grid-template-columns:1fr}}
.iebody{min-height:60vh;line-height:2.1;font-size:17px;resize:vertical;background:#fff}
.qside{border:1px solid var(--line);border-radius:12px;padding:10px;max-height:72vh;overflow-y:auto;background:#FBFBF9;position:sticky;top:0}
.qsec{font-size:11.5px;font-weight:700;color:var(--stamp);margin:10px 0 4px;border-bottom:1px dashed var(--line);padding-bottom:3px}

.qlist{padding-right:22px;font-size:13px;line-height:2}
.ocr{display:flex;flex-wrap:wrap;gap:10px}

.ocr-it img{width:100%;height:120px;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block;margin-bottom:6px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}

.lsted .lst-it{margin-bottom:6px}
.mini.xw{background:#2B579A;color:#fff;border-color:#2B579A}
.rem-list .it{line-height:1.7;padding:5px 0}

/* ── الموبايل ── */
header{padding-top:env(safe-area-inset-top)}

<script>
"use strict";
window.MK_PHONE_BUILD=true;
/* ═══════════ أدوات ═══════════ */
var ARD="٠١٢٣٤٥٦٧٨٩";
function ar(n){return String(n==null?"":n).replace(/[0-9]/g,function(d){return ARD[d]});}
function normAr(s){return toLatin(s).replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/\s+/g," ").trim().toLowerCase();}
function ddFilter(q){var n=normAr(q),any=false,first=null;
  document.querySelectorAll(".ddp .ddi[data-q]").forEach(function(b){var ok=!n||b.getAttribute("data-q").indexOf(n)>=0;b.classList.toggle("hid",!ok);if(ok){any=true;if(!first)first=b;}});
  var e=document.querySelector(".ddp .ddnone");if(!e){var p=document.querySelector(".ddp");if(p){e=document.createElement("div");e.className="ddnone";e.textContent="مافيش نتايج";p.appendChild(e);}}
  if(e)e.style.display=any?"none":"block";return first;}
function toLatin(s){return String(s==null?"":s).replace(/[٠-٩]/g,function(d){return ARD.indexOf(d)});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]});}
function iso(d){var x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function today(){return iso(new Date());}
function isDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||""));}
function dayDiff(a,b){return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000));}
function addDays(s,n){var d=new Date(s);d.setDate(d.getDate()+n);return iso(d);}
var AR_DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var AR_MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function prettyDate(s){var d=new Date(s);return AR_DAYS[d.getDay()]+" "+ar(d.getDate())+"/"+ar(d.getMonth()+1)+"/"+ar(d.getFullYear());}
function shortDate(s){if(!isDate(s))return "—";var d=new Date(s);return ar(d.getDate())+"/"+ar(d.getMonth()+1);}
function fullDate(s){if(!isDate(s))return "—";var d=new Date(s);return ar(d.getDate())+"/"+ar(d.getMonth()+1)+"/"+ar(d.getFullYear());}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function arr(v){return Array.isArray(v)?v:[];}
function clone(o){return JSON.parse(JSON.stringify(o));}
/* أرقام القيد القديمة — «أصل قيدها» من الأحدث للأقدم */
function prevNos(c){return arr(c&&c.prevNos);}
function numTxt(p){return ar(p.no)+"/"+ar(p.year)+" "+(p.register||"")+(p.station?" · "+String(p.station).replace("قسم ",""):"");}
function backTxt(x){return "تم قيد القضية برقم "+numTxt(x)+" وأُعيدت للرقم السابق أعلاه";}
function prevLines(c){var out=[],lab=false;prevNos(c).forEach(function(x){if(x.back)out.push({t:backTxt(x),b:true});else{if(!lab){out.push({t:"أصل قيدها:",h:true});lab=true;}out.push({t:numTxt(x)});}});return out;}
function prevTxt(c){var L=prevLines(c);return L.length?"\n"+L.map(function(l){return l.t}).join("\n"):"";}
function prevHTML(c){var L=prevLines(c);return L.length?'<div class="xxs" style="font-weight:400;font-family:inherit;color:var(--kraft);margin-top:3px;white-space:nowrap">'+
  L.map(function(l){return '<div'+(l.b?' style="color:var(--string);white-space:normal;max-width:230px"':"")+'>'+esc(l.t)+'</div>'}).join("")+'</div>':"";}
function prevBackIdx(c){var p=prevNos(c);for(var i=0;i<p.length;i++)if(!p[i].back)return i;return -1;}
function numKey(no,yr){return (+toLatin(yr)||0)*1e7+(+toLatin(no)||0);}
/* البحث بالرقم: الرقم اللي اتكتب بالظبط — مش أي رقم فيه نفس الأرقام */
function digitsEq(a,b){a=toLatin(a).trim();b=toLatin(b).trim();if(!a||!b)return false;
  if(/^\d+$/.test(a)&&/^\d+$/.test(b))return String(+a)===String(+b);return a===b;}
function numHit(c,q){q=toLatin(q).trim();if(!q)return true;
  var m=/^(\d+)\s*[\/\\-]\s*(\d{4})$/.exec(q),no=m?m[1]:q,yr=m?m[2]:null;
  function hit(n,y){return digitsEq(n,no)&&(!yr||String(y)===yr);}
  if(hit(c.no,c.year))return true;
  if(prevNos(c).some(function(p){return hit(p.no,p.year)}))return true;
  if(c.ledgerNo&&hit(c.ledgerNo,c.ledgerYear||CUR_YEAR))return true;
  if(!yr&&c.forensicNo&&toLatin(c.forensicNo).split(/[^0-9]+/).some(function(t){return digitsEq(t,no)}))return true;
  return false;}
function nowIso(){return new Date().toISOString();}

/* ═══════════ ثوابت ═══════════ */

var CUR_YEAR=String(new Date().getFullYear());
function yearList(a,b){var r=[];for(var y=b;y>=a;y--)r.push(String(y));return r;}
var YEAR_OPTS=yearList(2010,2050).map(function(y){return{v:y,l:ar(y)}});
var LEDGER_YEAR_OPTS=yearList(2010,2050).map(function(y){return{v:y,l:ar(y)}});

/* حالة القضية */

function dspKind(c){if(c.disposalKind)return c.disposalKind;var s=String((c.source||{}).disposalType||"").trim();return s?(DSP_FROM_SRC[s]||s):"";}
function dspText(c){if(!isDone(c))return "";var k=dspKind(c);if(!k)return "";
  if(k===DSP_JUR&&c.disposalSub)return k+" — "+c.disposalSub;
  if(k===DSP_SESSION&&c.sessionDate)return k+" — "+fullDate(c.sessionDate);
  return k;}
function normStatus(s,c){
  s=String(s||"").trim();

{n:"مخدرات",g:"مخدرات",sla:[30,120]},{n:"سلاح وذخيرة",g:"سلاح ناري",sla:[30,120]},{n:"سلاح أبيض",g:G_N,sla:[7,30]},

var DEFAULT_TYPES=TYPES.map(function(t){return JSON.parse(JSON.stringify(t))});

  var src=(D&&D.settings&&Array.isArray(D.settings.caseTypes)&&D.settings.caseTypes.length)?D.settings.caseTypes:DEFAULT_TYPES;
  TYPES=src.map(function(t){var x={n:String(t.n),g:GROUPS.indexOf(t.g)>=0?t.g:G_O,sla:(t.sla&&t.sla.length===2)?t.sla:[7,30],hidden:!!t.hidden};x.s=t.s||x.n;return x;});

function reps(c){return arr(c.techReports);}
function repIn(r){return !!(r.arrived||r.arrivedDate);}
function pending(c){return reps(c).filter(function(r){return !repIn(r)});}
function hasTech(c){return reps(c).length>0;}
function allTechIn(c){return hasTech(c)&&pending(c).length===0;}
function repState(c){return !hasTech(c)?"لا يوجد":reps(c).some(repIn)?"ورد":"لم يرد";}
function lastArrival(c){var x=reps(c).map(function(r){return isDate(r.arrivedDate)?r.arrivedDate:""}).filter(Boolean).sort();return x.length?x[x.length-1]:"";}
/* التنبيه: القضية لسه قيد التحقيق وكل تقاريرها الفنية وردت ومفيش تقرير تاني مطلوب */
function alertedReports(c){
  var n=num(SETS().reportAlertDays,0);
  if(n<0||!isOpen(c)||!allTechIn(c))return [];
  var la=lastArrival(c);if(la&&dayDiff(la,today())<n)return [];
  if(!la&&n>0)return [];
  return reps(c);
}
function techLate(c){return alertedReports(c).length>0;}
function techTxt(c){
  var fo=c.forensicNo?"رقم الطب الشرعي: "+ar(c.forensicNo):"";
  if(!hasTech(c))return fo||"—";
  return (fo?fo+" | ":"")+reps(c).map(function(r){return r.name.replace("تقرير ","")+": "+(isDate(r.arrivedDate)?"ورد "+fullDate(r.arrivedDate):r.arrived?"ورد (التاريخ غير محدد)":"لم يرد")}).join(" | ");
}

var VER=0,SYNC="",pushT=null,dirty=false,PUSHING=false;
function migrate(){
  D.officers=arr(D.officers);D.cases=arr(D.cases);D.investigations=arr(D.investigations);
  ["attendance","settings","caseLogs","qbank","snooze","secrets","tombs"].forEach(function(k){if(!D[k]||typeof D[k]!=="object"||Array.isArray(D[k]))D[k]={};});
  D.imports=arr(D.imports);
  applyTypes();
  D.cases.forEach(ensureCase);
  var t=today();Object.keys(D.snooze).forEach(function(k){if(!(D.snooze[k]>t))delete D.snooze[k];});
  BASE_SNAP=clone(D);
}
function ensureCase(c){
  c.action=c.action||"inv";c.holdReasons=arr(c.holdReasons).map(function(h){return HOLD_RENAME[h]||h});
  c.techReports=reps(c);c.officerIds=arr(c.officerIds);c.detainees=arr(c.detainees);
  if(c.holdNote==null)c.holdNote="";if(c.notes==null)c.notes="";
  if(c.ledgerNo==null)c.ledgerNo=(c.source&&c.source.ledgerNo)||"";
  if(c.ledgerYear==null)c.ledgerYear=(c.source&&c.source.ledgerYear)||"";
  c.caseStatus=normStatus(c.caseStatus,c);
  if(c.primaryType===undefined)c.primaryType=null;
  if(c.labNo){c.forensicNo=c.forensicNo&&c.forensicNo!==c.labNo?c.forensicNo+" / "+c.labNo:c.labNo;delete c.labNo;}
  c.detainees.forEach(function(d){d.id=d.id||uid("d");d.orders=arr(d.orders);d.appeals=arr(d.appeals);d.status=d.status||"held";});
  normalType(c);return c;
}
function uid(p){return (p||"x")+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function persist(){dirty=true;SYNC="بيحفظ…";clearTimeout(pushT);pushT=setTimeout(push,350);}
function deepEq(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function mergeById(base,loc,rem){
  var o=new Map(arr(base).map(function(x){return[x.id,x]})),l=new Map(arr(loc).map(function(x){return[x.id,x]})),r=new Map(arr(rem).map(function(x){return[x.id,x]}));
  var ch=[];new Set(Array.from(o.keys()).concat(Array.from(l.keys()))).forEach(function(id){if(!deepEq(o.get(id),l.get(id)))ch.push(id)});
  if(ch.some(function(id){return !deepEq(o.get(id),r.get(id))}))return null;
  ch.forEach(function(id){if(l.has(id))r.set(id,l.get(id));else r.delete(id);});
  return Array.from(r.values());
}
function reconcile(remote){
  if(!BASE_SNAP)return null;var m=clone(remote);
  var lists=["cases","investigations","officers"];
  for(var i=0;i<lists.length;i++){var x=mergeById(BASE_SNAP[lists[i]],D[lists[i]],remote[lists[i]]);if(!x)return null;m[lists[i]]=x;}
  var objs=["attendance","settings","caseLogs","qbank","snooze","imports","tombs"];
  for(var j=0;j<objs.length;j++){var a=objs[j];if(!deepEq(D[a],BASE_SNAP[a])){if(!deepEq(remote[a],BASE_SNAP[a]))return null;m[a]=D[a];}}
  return m;
}
function push(){
  if(!D)return;
  if(PUSHING){clearTimeout(pushT);pushT=setTimeout(push,400);return;}
  PUSHING=true;
  fetch("api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({v:VER,data:D})})
  .then(function(r){if(r.status===401){var e=Error("locked");e.gate=true;throw e;}return r.json().then(function(j){if(!r.ok)throw Error(j.error||"تعذر الحفظ");return j;})})
  .then(function(j){PUSHING=false;
    if(j.ok){VER=j.v;dirty=false;SYNC="محفوظ ومتشفر";BASE_SNAP=clone(D);render();return;}
    if(j.conflict&&j.data){var m=reconcile(j.data);
      if(!m){SYNC="تعديل من تابة تانية — اتحدّث";D=j.data;VER=j.v;migrate();dirty=false;render();toast("البرنامج مفتوح في تابة تانية واتعدل منها — اتحدّثت البيانات");return;}
      D=m;VER=j.v;BASE_SNAP=clone(j.data);dirty=true;clearTimeout(pushT);pushT=setTimeout(push,80);return;}
    throw Error(j.error||"تعذر الحفظ");})
  .catch(function(err){PUSHING=false;if(err.gate){showGate("unlock","البرنامج اتقفل — اكتب كلمة السر وتعديلك هيتحفظ");return;}
    SYNC="تعذر الحفظ — هيحاول تاني";toast(err.message);render();clearTimeout(pushT);pushT=setTimeout(push,4000);});
}

function postJson(url,data){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
  .then(function(r){return r.json().catch(function(){return{error:"رد غير صالح من البرنامج"}}).then(function(j){if(!r.ok||j.ok===false){var e=Error(j.error||"فشل الاتصال");e.status=r.status;throw e;}return j;})});}
function postBlob(url,data){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
  .then(function(r){if(!r.ok)return r.json().catch(function(){return{}}).then(function(j){throw Error(j.error||"تعذر تجهيز الملف")});return r.blob();});}
function download(blob,name){name=String(name).replace(/[\\\/:*?"<>|\n]+/g," ").slice(0,140);
  if(MK_PHONE&&navigator.canShare&&window.File){try{var fl=new File([blob],name,{type:blob.type||"application/octet-stream"});if(navigator.canShare({files:[fl]})){navigator.share({files:[fl]}).catch(function(e){if(e&&e.name!=="AbortError")plainDownload(blob,name);});return;}}catch(e){}}
  plainDownload(blob,name);}

  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},60000);}

function rpPend(){return S.rp.mode==="pending";}
function reportRows(){
  var f=S.rp,rows=[],ranged=!!(f.d1||f.d2),pend=rpPend();
  D.cases.forEach(function(c){if(isDone(c))return;reps(c).forEach(function(r){
    if(pend){if(repIn(r))return;if(ranged){if(!isDate(c.arrivalDate))return;if(f.d1&&c.arrivalDate<f.d1)return;if(f.d2&&c.arrivalDate>f.d2)return;}}
    else{if(!repIn(r))return;var dated0=isDate(r.arrivedDate);if(dated0){if(f.d1&&r.arrivedDate<f.d1)return;if(f.d2&&r.arrivedDate>f.d2)return;}else if(ranged&&f.undated!=="show")return;}
    if(f.types.length&&f.types.indexOf(r.name)<0)return;
    if(f.no){var n=toLatin(f.no).trim();if(String(c.no).indexOf(n)<0&&String(c.ledgerNo||"").indexOf(n)<0&&toLatin(c.forensicNo||"").indexOf(n)<0)return;}
    rows.push({c:c,r:r,dated:pend?isDate(c.arrivalDate):isDate(r.arrivedDate)});
  })});
  if(pend)rows.sort(function(a,b){if(a.dated!==b.dated)return a.dated?-1:1;var x=a.c.arrivalDate||"",y=b.c.arrivalDate||"";return x<y?-1:x>y?1:0;});
  else rows.sort(function(a,b){if(a.dated!==b.dated)return a.dated?-1:1;return a.r.arrivedDate<b.r.arrivedDate?1:a.r.arrivedDate>b.r.arrivedDate?-1:0;});
  return rows;
}

  var r=pRange(),inv=D.cases.filter(function(c){return isInv(c)&&inRange(c,r)}),ta=D.cases.filter(function(c){return !isInv(c)&&inRange(c,r)});
  var done=inv.filter(isDone);
  var byType={};inv.forEach(function(c){var k=caseTypeKey(c);var x=byType[k]||(byType[k]={name:k,g:TMAP[k]?TMAP[k].g:"",n:0,d:0,list:[]});x.n++;if(isDone(c))x.d++;x.list.push(c);});

  var att={work:0,sess:0,night:0};Object.keys(D.attendance).forEach(function(d){if(d<r.from||d>r.to)return;var a=D.attendance[d];if(worked(a))att.work++;if(a.s==="جلسة محكمة")att.sess++;if(a.night)att.night++;});
  var bucket=(r.to>=r.from&&dayDiff(r.from,r.to)<=62)?"d":"m",map={};
  inv.concat(ta).forEach(function(c){var d=distDate(c),k=bucket==="d"?d:d.slice(0,7);map[k]=(map[k]||0)+1;});
  var trend=Object.keys(map).sort().map(function(k){return{name:bucket==="m"?AR_MON[+k.slice(5)-1]+" "+k.slice(2,4):shortDate(k),value:map[k]}});

}

function myMonthly(){
  var out=[],INV=D.cases.filter(function(c){return isInv(c)&&distDate(c)}),now=new Date(),start=new Date(now.getFullYear(),now.getMonth()-11,1),cur=new Date(start),lim=0;
  while(cur<=now&&lim++<24){
    var d0=iso(cur),nx=new Date(cur.getFullYear(),cur.getMonth()+1,1),d1=iso(nx);
    var inM=function(s){return isDate(s)&&s>=d0&&s<d1};
    var before=INV.filter(function(c){return distDate(c)<d0}),fresh=INV.filter(function(c){return inM(distDate(c))});
    var carry=before.filter(function(c){return !isDone(c)||!isDate(c.disposalDate)||c.disposalDate>=d0}).length;
    var dOld=before.filter(function(c){return isDone(c)&&inM(c.disposalDate)}).length,dNew=fresh.filter(function(c){return isDone(c)&&inM(c.disposalDate)}).length;
    out.push({label:AR_MON[cur.getMonth()]+" "+ar(cur.getFullYear()),carryIn:carry,fresh:fresh.length,dOld:dOld,dNew:dNew,total:carry+fresh.length,rest:carry+fresh.length-dOld-dNew});
    cur=nx;
  }
  return out;
}

  var f=a.d1,t=a.d2||today();if(!f)return null;if(f>t){var x=f;f=t;t=x;}return{from:f,to:t,label:"من "+fullDate(f)+" إلى "+fullDate(t)};}
function achCalc(list,r){var o={old:0,neu:0,dOld:0,dNew:0};
  list.forEach(function(c){var dd=isDone(c)&&isDate(c.disposalDate)?c.disposalDate:null,d0=distDate(c);
    if(d0<r.from){if(isOpen(c)||(dd&&dd>=r.from)){o.old++;if(dd&&dd<=r.to)o.dOld++;}}
    else if(d0<=r.to){o.neu++;if(dd&&dd<=r.to)o.dNew++;}});
  o.tot=o.old+o.neu;o.done=o.dOld+o.dNew;o.rest=o.tot-o.done;
  o.pOld=o.old?Math.round(o.dOld/o.old*100):null;o.pNew=o.neu?Math.round(o.dNew/o.neu*100):null;o.pTot=o.tot?Math.round(o.done/o.tot*100):null;return o;}

function ieQA(){

function bankData(type){
  var m={},qb=D.qbank[type]||{},hid=arr(qb.hidden);
  D.investigations.forEach(function(v){var c=caseById(v.caseId);if(!c||caseTypeKey(c)!==type)return;var seen={};
    extractQs(v.body).forEach(function(q){var k=normQ(q);if(!k||seen[k])return;seen[k]=1;var x=m[k]||(m[k]={q:q.replace(/\s*[؟?]*\s*$/,"؟"),k:k,n:0,cases:{},manual:false});x.n++;x.cases[c.id]=1;});});
  arr(qb.extra).forEach(function(q){var k=normQ(q);if(!m[k])m[k]={q:q,k:k,n:0,cases:{},manual:true};else m[k].manual=true;});
  return Object.keys(m).map(function(k){var x=m[k];x.nc=Object.keys(x.cases).length;x.hidden=hid.indexOf(k)>=0;return x;})
    .sort(function(a,b){return b.n-a.n||(a.q<b.q?-1:1)});

function memberKey(s){return String(s||"").trim().replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ة/g,"ه").replace(/(^|\s)(بك|هانم)(?=\s|$)/g," ").replace(/\s+/g,"");}
function impParse(text){
  var o=JSON.parse(text);if(o&&o.data&&o.data.cases)o=o.data;
  if(!o||!Array.isArray(o.cases)||!Array.isArray(o.members))throw Error("الملف ده مش نسخة من لوحة النيابة (لازم يكون فيه القضايا والأعضاء)");
  return o;
}
function impMine(B,mid){
  var m=B.members.filter(function(x){return x.id===mid})[0],key=m?memberKey(m.name):"";
  return B.cases.filter(function(c){if(c.assignedTo)return c.assignedTo===mid;
    var n=c.disposedByName||c.assignedToName||c.assignedToOriginal;return !!n&&!!key&&memberKey(n)===key;});
}
function impPreview(){
  var P=S.imp,B=P.board,mine=impMine(B,P.mid),have={};D.cases.forEach(function(c){have[c.boardId||c.id]=c;});
  var add=mine.filter(function(c){return !have[c.id]}).length,upd=mine.length-add;
  var att=0;Object.keys(B.attendance||{}).forEach(function(d){if((B.attendance[d]||{})[P.mid])att++;});
  return{mine:mine,add:add,upd:upd,att:att,open:mine.filter(function(c){return normStatus(c.caseStatus,c)!==ST_DONE}).length};
}

function impCommit(){
  var P=S.imp,B=P.board,mine=impMine(B,P.mid),byId={},added=0,updated=0;
  D.cases.forEach(function(c){byId[c.boardId||c.id]=c;});
  var bo={};arr(B.officers).forEach(function(o){bo[o.id]=o;});
  var myOff={};D.officers.forEach(function(o){myOff[normAr(o.name)]=o;});
  function mapOff(id){var o=bo[id];if(!o||!String(o.name||"").trim())return null;var k=normAr(o.name),x=myOff[k];
    if(!x){x={id:uid("o"),name:String(o.name).trim(),rank:"",job:"",workplace:o.workplace||"",phone:"",active:o.active!==false};D.officers.push(x);myOff[k]=x;}
    else if(!x.workplace&&o.workplace)x.workplace=o.workplace;return x.id;}
  if(P.offs)arr(B.officers).forEach(function(o){mapOff(o.id)});
  mine.forEach(function(bc){
    var ex=byId[bc.id],offIds=arr(bc.officerIds).map(mapOff).filter(Boolean);
    if(!ex){var c=clone(bc);c.boardId=bc.id;c.officerIds=offIds;delete c.assignedTo;c.holdNote="";c.notes="";c.detainees=[];ensureCase(c);D.cases.push(c);added++;
      if(B.caseLogs&&B.caseLogs[bc.id]&&!D.caseLogs[c.id])D.caseLogs[c.id]={dist:arr(B.caseLogs[bc.id].dist),log:arr(B.caseLogs[bc.id].log)};return;}
    if(!P.update)return;
    var before=JSON.stringify(ex);
    ["caseStatus","disposalDate","disposalKind","disposalSub","sessionDate","ledgerNo","ledgerYear","ledgerDate","forensicNo","primaryType","statGroup","venue"].forEach(function(k){if(bc[k]!=null&&bc[k]!=="")ex[k]=bc[k];});
    /* إعادة القيد أو تصحيح الرقم اللي اتعمل في لوحة النيابة */
    var bn={no:String(bc.no||""),year:String(bc.year||""),register:bc.register,station:bc.station};
    if(bn.no&&(bn.no!==String(ex.no)||bn.year!==String(ex.year)||bn.register!==ex.register||bn.station!==ex.station)){
      ex.no=bn.no;ex.year=bn.year;ex.register=bn.register||ex.register;ex.station=bn.station||ex.station;
      if(arr(bc.prevNos).length)ex.prevNos=clone(bc.prevNos);else delete ex.prevNos;}
    else if(JSON.stringify(arr(bc.prevNos))!==JSON.stringify(prevNos(ex))){if(arr(bc.prevNos).length)ex.prevNos=clone(bc.prevNos);else delete ex.prevNos;}
    if(!ex.accused&&bc.accused)ex.accused=bc.accused;
    if(!arr(ex.types).length&&arr(bc.types).length)ex.types=bc.types.slice();
    if(!isDate(ex.assignedDate)&&isDate(bc.assignedDate))ex.assignedDate=bc.assignedDate;
    var hr=arr(ex.holdReasons);arr(bc.holdReasons).forEach(function(h){if(hr.indexOf(h)<0)hr.push(h)});ex.holdReasons=hr;
    var rm={};reps(ex).forEach(function(r){rm[r.name]=r});arr(bc.techReports).forEach(function(r){var x=rm[r.name];if(!x){ex.techReports.push(clone(r));}else if(repIn(r)&&!repIn(x)){x.arrived=true;x.arrivedDate=r.arrivedDate||x.arrivedDate;}});
    offIds.forEach(function(id){if(ex.officerIds.indexOf(id)<0)ex.officerIds.push(id)});
    if(B.caseLogs&&B.caseLogs[bc.id]){var L=D.caseLogs[ex.id]||(D.caseLogs[ex.id]={log:[],dist:[]});L.dist=arr(B.caseLogs[bc.id].dist);}
    ensureCase(ex);if(JSON.stringify(ex)!==before){updated++;logCase(ex,["تحديث من لوحة النيابة"]);}
  });
  var nAtt=0;
  if(P.att){Object.keys(B.attendance||{}).forEach(function(d){var r=(B.attendance[d]||{})[P.mid];if(!r)return;var a=D.attendance[d];if(a&&a.src==="me")return;
      D.attendance[d]={s:r.s||"موجود",night:!!r.night,note:r.note||"",src:"board"};nAtt++;});
    mine.forEach(function(c){var d=c.assignedDate;if(isDate(d)&&!D.attendance[d]){D.attendance[d]={s:"موجود",src:"auto"};nAtt++;}});}
  if(P.head&&B.settings){["kulliya","juz"].forEach(function(k){if(B.settings[k])D.settings[k]=B.settings[k]});if(B.settings.logo)D.settings.logo=B.settings.logo;
    if(B.settings.caseTypes&&!D.settings.caseTypes){D.settings.caseTypes=B.settings.caseTypes;applyTypes();}}
  var m=B.members.filter(function(x){return x.id===P.mid})[0];if(m&&!D.settings.boardName)D.settings.boardName=m.name;
  D.imports.push({at:iso(new Date())+"T"+nowTime(),file:P.file||"",member:m?m.name:"",added:added,updated:updated,att:nAtt});
  S.imp=null;S.modal=null;save();
  toast("اتضاف "+ar(added)+" قضية واتحدث "+ar(updated)+(nAtt?" · "+ar(nAtt)+" يوم حضور":""));
}

function doPrint(title,head,rows,sub,opt){

  var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var payload={title:title,sub:sub||"",head:head,headHTML:opt.headHTML||"",tiny:!!opt.tiny,nw:opt.nw||[],portrait:!!opt.portrait,
    rows:rows.map(function(r){return{c:r.map(function(x){return String(x==null?"":x)}),tot:!!r._tot}}),settings:sheetSettings(),created:nowIso()};
  if(MK_PHONE){phoneSheet(payload);return;}
  window.MK_SHEETS[id]=payload;
  try{sessionStorage.setItem("mk.sheet."+id,JSON.stringify(payload));}catch(e){}
  var w=window.open(location.pathname+"?sheet="+id,"_blank");
  if(!w)toast("المتصفح منع فتح تابة جديدة — اسمح بالنوافذ المنبثقة");
  setTimeout(function(){try{sessionStorage.removeItem("mk.sheet."+id);}catch(e){}},20000);
}
function sheetHTML(p){
  var st=p.settings,headHTML=p.headHTML||('<tr>'+p.head.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+'</tr>');
  return '<div class="paper"><table class="pl"><thead><tr><td>'+letterheadHTML(st)+'</td></tr></thead><tfoot><tr><td>'+letterfootHTML(st)+'</td></tr></tfoot>'+
    '<tbody><tr><td><div class="doc-title">'+esc(p.title)+'</div><div class="doc-sub">'+(p.sub?esc(p.sub)+" — ":"")+'عدد السجلات: '+ar(p.rows.filter(function(r){return !r.tot}).length)+'</div>'+
    '<table class="pt'+(p.tiny?" tiny":"")+'"><thead>'+headHTML+'</thead><tbody>'+
    (p.rows.length?p.rows.map(function(r){return '<tr'+(r.tot?' class="tot"':"")+'>'+r.c.map(function(x,j){return '<td'+(arr(p.nw).indexOf(j)>=0?' style="white-space:nowrap"':"")+'>'+esc(x)+'</td>'}).join("")+'</tr>'}).join("")
      :'<tr><td colspan="'+p.head.length+'" style="text-align:center;color:#888;padding:14px">لا توجد بيانات</td></tr>')+'</tbody></table></td></tr></tbody></table></div>';
}
var SHEET=null,SHEET_EDITED=false;
function sheetBoot(id){
  document.body.classList.add("sheetmode");
  var p=null;
  try{if(window.opener&&window.opener.MK_SHEETS)p=window.opener.MK_SHEETS[id];}catch(e){}
  if(!p){try{var r=sessionStorage.getItem("mk.sheet."+id);if(r)p=JSON.parse(r);sessionStorage.removeItem("mk.sheet."+id);}catch(e){}}
  var root=document.getElementById("printroot");root.classList.add("show");
  if(!p){root.innerHTML='<div class="paper" style="text-align:center;line-height:2"><h2>الكشف ده مش متاح</h2><p class="xs muted">ارجع للبرنامج وطلّع الكشف تاني.</p></div>';return;}
  SHEET=clone(p);document.title=SHEET.title;
  if(SHEET.portrait){var stl=document.createElement("style");stl.textContent="@media print{@page{size:A4 portrait;margin:10mm}}";document.head.appendChild(stl);}
  root.innerHTML='<div class="noprint pe-bar"><span class="t">'+esc(SHEET.title)+'</span><div class="row">'+
    '<button class="btn kra s" data-sh="pdf">حفظ PDF</button><button class="btn s xw" data-sh="docx">Word</button><button class="btn s xx" data-sh="xlsx">Excel</button><button class="btn led s" data-sh="print">طباعة</button>'+
    '<span id="pe-lock"><button class="btn gh s" data-sh="edit">تعديل الكشف</button></span><button class="btn gh s" data-sh="close">إغلاق</button></div></div>'+sheetHTML(SHEET);
  root.addEventListener("input",function(e){
    if(e.target.getAttribute&&e.target.getAttribute("contenteditable")==="true"){SHEET_EDITED=true;
      var n=document.getElementById("pe-note");if(n&&SHEET.settings.pdfShowModified!==false)n.classList.add("on");}
  });
  document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-sh]");if(!b)return;
    var a=b.getAttribute("data-sh");
    if(a==="print")window.print();
    else if(a==="close")window.close();
    else if(a==="edit"){root.classList.add("editing");root.querySelectorAll("table.pt td, table.pt th, .doc-title, .doc-sub").forEach(function(x){x.setAttribute("contenteditable","true")});
      document.getElementById("pe-lock").innerHTML='<span class="xs b" style="color:#F3D28B">التعديل مفتوح — دوس على أي خانة وعدّل</span>';}
    else if(a==="pdf")sheetPdf(b);
    else if(a==="docx"||a==="xlsx")sheetExport(a,b);
  });
}
function sheetData(){
  var root=document.getElementById("printroot"),t=root.querySelector("table.pt");
  function txt(el){return (el.innerText||el.textContent||"").replace(/ /g," ").replace(/[ \t]+\n/g,"\n").trim();}
  function cells(tr){return Array.prototype.map.call(tr.cells,function(td){return{t:txt(td),cs:td.colSpan||1,rs:td.rowSpan||1}});}
  var st=SHEET.settings||{},tEl=root.querySelector(".doc-title"),sEl=root.querySelector(".doc-sub");
  return{title:tEl?txt(tEl):SHEET.title,sub:sEl?txt(sEl):"",tiny:!!SHEET.tiny,
    head:Array.prototype.map.call(t.tHead.rows,cells),
    rows:Array.prototype.map.call(t.tBodies[0].rows,function(tr){return{c:cells(tr),tot:tr.classList.contains("tot")}}),
    kulliya:st.kulliya||"",juz:st.juz||"",chief:(st.pdfShowSignature!==false&&st.myName)?st.myName:"",chiefTitle:st.myTitle||"",date:prettyDate(today()),
    credit:st.pdfShowCredit!==false,edited:!!(SHEET_EDITED&&st.pdfShowModified!==false)};
}
function logoPng(src){return new Promise(function(res){var img=new Image();img.onload=function(){try{var M=240,k=Math.min(1,M/Math.max(img.width,img.height)),cv=document.createElement("canvas");
  cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL("image/png"));}catch(e){res("");}};
  img.onerror=function(){res("")};img.src=src||DEFAULT_LOGO;});}
function sheetExport(fmt,btn){
  var data=sheetData();btn.disabled=true;var old=btn.textContent;btn.textContent="جاري التجهيز…";
  logoPng((SHEET.settings&&SHEET.settings.logo)||DEFAULT_LOGO).then(function(png){data.logo=png;return postBlob("api/export/"+fmt,data);})
  .then(function(b){download(b,(data.title||SHEET.title)+"."+fmt);toast(fmt==="docx"?"اتحفظ ملف الـWord":"اتحفظ ملف الـExcel");})
  .catch(function(err){toast(err.message);})
  .then(function(){btn.disabled=false;btn.textContent=old;});
}
function sheetPdf(btn){
  var root=document.getElementById("printroot").cloneNode(true);
  root.querySelectorAll(".noprint").forEach(function(x){x.remove()});
  root.querySelectorAll("[contenteditable]").forEach(function(x){x.removeAttribute("contenteditable")});
  root.classList.remove("editing");
  var css=document.getElementById("main-style").textContent+(SHEET.portrait?"@media print{@page{size:A4 portrait;margin:10mm}}":"");
  var html='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+esc(SHEET.title)+'</title><style>'+css+'</style></head>'+
    '<body class="sheetmode"><div id="printroot" class="show">'+root.innerHTML+'</div></body></html>';
  btn.disabled=true;var old=btn.textContent;btn.textContent="جاري التجهيز…";
  postBlob("api/pdf/render",{html:html,title:SHEET.title})
  .then(function(b){download(b,SHEET.title+".pdf");toast("اتحفظ ملف الـPDF");})
  .catch(function(err){toast(err.message+" — هتفتحلك نافذة الطباعة، اختار «حفظ كـ PDF»");setTimeout(function(){window.print()},700);})
  .then(function(){btn.disabled=false;btn.textContent=old;});
}

function syncIeBody(){var ta=document.getElementById("ie-body");if(ta&&S.ie)S.ie.body=ta.value;}
var DOWN_T=null;
function bindApp(){

    var t=e.target;
    if(t.id==="restore-file"&&t.files[0]){var f=t.files[0];t.value="";

    if(t.id==="ie-img"&&t.files.length){syncIeBody();var fs=Array.prototype.slice.call(t.files,0,8);t.value="";
      Promise.all(fs.map(shrinkImage)).then(function(urls){urls.forEach(function(u){IE_IMGS.push({url:u})});render();}).catch(function(err){toast(err.message)});return;}
    if(!t.dataset||!t.dataset.act)return;
    if(t.tagName==="SELECT"||(t.tagName==="INPUT"&&/^(date|number|checkbox|time|radio)$/.test(t.type)))handle(t.dataset.act,t.dataset,e,"change");
  });

  });
